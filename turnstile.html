<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; frame-src 'self' https://challenges.cloudflare.com; connect-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'"
    />
    <title>MovingSpot verification</title>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: #0d020b;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        font-family: Arial, sans-serif;
      }
    </style>
  </head>
  <body>
    <div
      class="cf-turnstile"
      data-sitekey="0x4AAAAAAE4OCEiyZKmRahw5"
      data-theme="dark"
      data-size="flexible"
      data-action="otp_send"
      data-callback="onTurnstileSuccess"
      data-error-callback="onTurnstileError"
      data-expired-callback="onTurnstileExpired"
      data-timeout-callback="onTurnstileTimeout"
    ></div>

    <script>
      function postToMovingSpot(type, token) {
        if (!window.ReactNativeWebView) return;

        window.ReactNativeWebView.postMessage(
          JSON.stringify({
            type: type,
            token: token || null,
          }),
        );
      }

      function onTurnstileSuccess(token) {
        postToMovingSpot('turnstile-success', token);
      }

      function onTurnstileError() {
        postToMovingSpot('turnstile-error');
      }

      function onTurnstileExpired() {
        postToMovingSpot('turnstile-expired');
      }

      function onTurnstileTimeout() {
        postToMovingSpot('turnstile-timeout');
      }
    </script>
  </body>
</html>
